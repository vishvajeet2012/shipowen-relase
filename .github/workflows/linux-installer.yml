# Builds the Shipown Linux installer, the Debian package
# (shipown-<version>-amd64.deb, for Debian and Ubuntu), on GitHub's Ubuntu
# runners, from the private source repository vishvajeet2012/ops at the commit
# you choose, read through a read-only deploy key (the OPS_DEPLOY_KEY secret).
# This repository holds no source code.
#
# It builds, checks latest-linux.yml, installs the package with apt (which also
# proves its dependencies resolve) and starts the installed app, and keeps the
# result as a workflow artifact for 7 days. Then it deletes the Linux artifacts
# of earlier runs, so only the newest build is here. It has no key to the
# download server and publishes nothing: in ops/push-ops,
# scripts/publish-from-actions.cjs downloads the artifact and publishes it after
# checking its SHA-512.
#
# The same checked .deb is then repackaged as the Snap Store's snap
# (push-ops/packaging/snap), installed with snapd and started on Ubuntu 22.04
# and 24.04, and kept as the shipown-snap-<version> artifact. Nothing here has a
# Snap Store login: the snap is uploaded by hand (snapcraft upload), and
# publish-from-actions.cjs leaves it alone.

name: Linux installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of vishvajeet2012/ops to build
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: linux-installer-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check on Ubuntu
    # The oldest Ubuntu still supported here: a package that installs and
    # starts on 22.04 does on the newer ones too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: push-ops
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: vishvajeet2012/ops
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: push-ops

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-ops/package-lock.json

      - name: Read the version and the commit
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "Building ops@$(git rev-parse --short HEAD), Shipown $(node -p "require('./package.json').version")"

      # electron-builder needs fakeroot to produce a deb.
      - name: Install the packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build:ts

      - name: Build the package
        run: npx electron-builder --linux --publish never --config electron-builder.yml

      - name: Check latest-linux.yml names the package with its real SHA-512
        run: node scripts/publish-installer.cjs --skip-build --dry-run

      # The package itself, as a person installs it. It keeps the name push-ops
      # (package.json's name) so dpkg upgrades the installed copy.
      - name: Install it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb="build/shipown-$VERSION-amd64.deb"
          dpkg-deb --info "$deb" | sed -n '/Package:/,/Description:/p'
          sudo apt-get install -y -qq "./$deb"
          exe=$(dpkg -L push-ops | while read -r f; do
            case "$f" in /opt/*/push-ops|/opt/*/shipown|/opt/*/Shipown) [ -f "$f" ] && [ -x "$f" ] && echo "$f" ;; esac
          done | head -1)
          [ -n "$exe" ] || { echo "No executable under /opt after installing"; exit 1; }
          echo "installed: $exe"
          echo "SHIPOWN_EXE=$exe" >> "$GITHUB_ENV"

      - name: Start the installed app
        run: node scripts/smoke-packaged.cjs "$SHIPOWN_EXE" x64

      - uses: actions/upload-artifact@v6
        with:
          name: shipown-linux-${{ steps.version.outputs.version }}
          path: |
            push-ops/build/shipown-${{ steps.version.outputs.version }}-amd64.deb
            push-ops/build/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  snap:
    name: Snap, from the checked package
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: vishvajeet2012/ops
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: push-ops

      - uses: actions/download-artifact@v6
        with:
          name: shipown-linux-${{ needs.build.outputs.version }}
          path: deb

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      # core22 is Ubuntu 22.04, this runner, so it builds on the runner itself.
      - name: Build the snap
        working-directory: push-ops/packaging/snap
        run: |
          cp "$GITHUB_WORKSPACE/deb/shipown-$VERSION-amd64.deb" shipown.deb
          sed -i "s/^version: .*/version: '$VERSION'/" snapcraft.yaml
          sudo snapcraft pack --destructive-mode
          ls -l shipown_*.snap
          if unsquashfs -lls shipown_*.snap | grep -E '^-..s'; then echo "A setuid file is in the snap; the store refuses it"; exit 1; fi

      - uses: actions/upload-artifact@v6
        with:
          name: shipown-snap-${{ needs.build.outputs.version }}
          path: push-ops/packaging/snap/shipown_*.snap
          if-no-files-found: error
          retention-days: 7

  snap-check:
    name: Snap installs and starts on ${{ matrix.os }}
    needs: [build, snap]
    strategy:
      fail-fast: false
      matrix:
        # 24.04 is where AppArmor may stop an unconfined app making the user
        # namespace Electron's sandbox needs.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: vishvajeet2012/ops
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: push-ops

      - uses: actions/download-artifact@v6
        with:
          name: shipown-snap-${{ needs.build.outputs.version }}
          path: snap

      # A classic snap uses the desktop's own GTK and NSS, as the .deb does:
      # the libraries its Depends name, which every Ubuntu desktop has.
      - name: Install it as a person would
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 >/dev/null
          sudo snap install --dangerous --classic snap/shipown_*.snap
          snap list shipown
          echo "unprivileged user namespaces restricted by AppArmor: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

      - name: Start the installed app's Node side
        run: node push-ops/scripts/smoke-packaged.cjs /snap/shipown/current/opt/Shipown/push-ops x64

      # The window itself, through the command a person runs: Electron's
      # sandbox fails at once if it cannot start, so still running after 25s
      # is the pass.
      - name: Open its window
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          set +e
          timeout 25 xvfb-run -a /snap/bin/shipown > run.log 2>&1
          code=$?
          set -e
          tail -20 run.log
          if [ "$code" != 124 ]; then echo "Shipown exited ($code) before 25s"; exit 1; fi
          if grep -qi 'sandbox' run.log && grep -qi 'fatal' run.log; then echo "Electron's sandbox did not start"; exit 1; fi

  prune:
    name: Delete older Linux builds
    needs: [build, snap]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the Linux and Snap artifacts of earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select((.name | startswith(\"shipown-linux-\")) or (.name | startswith(\"shipown-snap-\"))) | select(.workflow_run.id != $RUN) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted artifact $id"
          done
